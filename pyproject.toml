[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finllm"
version = "0.1.0"
description = "A GPT-style language model built from scratch in PyTorch, adapted to financial text and tested as a trading signal."
authors = [{ name = "Manthan Gehlot" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-q"
